- type: entity
  parent: BaseGameRule
  id: Thief
  components:
  - type: ThiefRule
  - type: AntagObjectives
    objectives:
    - EscapeThiefShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: ThiefBigObjectiveGroups
      prob: 0.7
      maxPicks: 1
    - groups: ThiefObjectiveGroups
      maxPicks: 10
    maxDifficulty: 2.5
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Thief ]
      max: 3
      playerRatio: 20
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: ThiefGear
      components:
      - type: Pacified
      - type: Thieving
        stripTimeReduction: 2
        stealthy: true
      mindRoles:
      - MindRoleThief
      briefing:
        sound: "/Audio/Misc/thief_greeting.ogg"

# Provocateur - A pacifist agent who manipulates crew into killing their targets
# Unlike traitors (direct violence) or ninja (tech sabotage), the Provocateur
# must use social manipulation to get the crew to eliminate targets for them.
- type: entity
  parent: BaseGameRule
  id: Provocateur
  components:
  - type: ProvocateurRule
  - type: AntagObjectives
    objectives:
    - EscapeProvocateurShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: ProvocateurObjectiveGroupKill
      maxPicks: 1
    - groups: ProvocateurObjectiveGroups
      maxPicks: 2
    maxDifficulty: 4.0
  - type: AntagSelection
    agentName: provocateur-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Provocateur ]
      max: 2
      playerRatio: 25
      lateJoinAdditional: true
      multiAntagSetting: NotExclusive
      startingGear: ProvocateurGear
      components:
      - type: Pacified
      mindRoles:
      - MindRoleProvocateur
      briefing:
        text: provocateur-role-greeting-human
        color: Orange

# Needs testing
- type: entity
  parent: BaseWizardRule
  id: SubWizard
  components:
  - type: AntagSelection
    agentName: wizard-round-end-name
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ Wizard ]
      max: 1
      playerRatio: 1
      spawnerPrototype: SpawnPointGhostWizard
      roleLoadout:
      - RoleSurvivalExtended
      briefing:
        text: wizard-role-greeting
        color: Turquoise
        # TODO: Need Wizard Start sound
        #sound: "/Audio/Ambience/Antag/wizard_start.ogg"
      startingGear: WizardBlueGear
      # TODO: WizardComp as needed
      components:
      - type: NpcFactionMember
        factions:
        - Wizard
      - type: RandomMetadata
        nameSegments:
        - NamesWizardFirst
        - NamesWizardLast
        nameFormat: name-format-wizard
      mindRoles:
      - MindRoleWizard
